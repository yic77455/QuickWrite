name: Build Linux release

# 仅手动触发：在 Actions 页面点 Run workflow 出包，避免每次 push 都跑完整构建
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LANG: C.UTF-8

jobs:
  build:
    # 显式固定 24.04：测试虚拟机也是 24.04，避免 ubuntu-latest 漂移后 glibc 基线变高
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libayatana-appindicator3-dev libsecret-1-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Fetch packages
        run: flutter pub get

      - name: Build release bundle
        run: flutter build linux --release

      - name: Inject version.json
        run: |
          set -euo pipefail
          # package_info_plus 在 Linux 上读 data/flutter_assets/version.json 取版本号，
          # Flutter 的 Linux 构建不生成该文件；缺失时版本号为空串，
          # 会让「检查更新」把任何发布版本都判成新版本，这里按 pubspec 补上。
          FULL_VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml | tr -d '"')"
          APP_VERSION="${FULL_VERSION%%+*}"
          BUILD_NUMBER="${FULL_VERSION#*+}"
          if [ "${BUILD_NUMBER}" = "${FULL_VERSION}" ]; then BUILD_NUMBER="0"; fi

          ASSET_DIR="build/linux/x64/release/bundle/data/flutter_assets"
          mkdir -p "${ASSET_DIR}"
          printf '{"app_name":"QuickWrite","package_name":"com.quickwrite.app","version":"%s","build_number":"%s"}\n' \
            "${APP_VERSION}" "${BUILD_NUMBER}" > "${ASSET_DIR}/version.json"
          echo "已写入版本信息："
          cat "${ASSET_DIR}/version.json"

      - name: Package bundle
        run: |
          cd build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/quick-write-linux-x64.tar.gz" .
          ls -lh "$GITHUB_WORKSPACE/quick-write-linux-x64.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quick-write-linux-x64
          path: quick-write-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30
