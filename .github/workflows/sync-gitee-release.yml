name: Sync release to Gitee

# GitHub 草稿 Release 被人工 Publish 后触发。Gitee 是客户端的优先更新源，
# 两边必须同名同内容；这一步把 GitHub 上的 Release 正文与全部资产镜像过去。
# 同步失败时可用 workflow_dispatch 指定同一个 tag 手动补跑，无需重发版本。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步的 Release tag，例如 v1.2.9'
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04

    steps:
      # 两种触发方式的 tag 来源不同：自动事件从 release 对象取，手动触发从 input 取。
      # 手动补跑时 release 对象为空，name/body 改用 gh API 现查，避免传空值覆盖 Gitee。
      - name: Resolve release metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${EVENT_TAG:-$INPUT_TAG}"
          if [ -z "${TAG}" ]; then
            echo "::error::未指定要同步的 tag"
            exit 1
          fi

          NAME="${{ github.event.release.name }}"
          BODY="${{ github.event.release.body }}"
          if [ -z "${NAME}" ] || [ -z "${BODY}" ]; then
            NAME="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json name -q .name)"
            BODY="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json body -q .body)"
          fi

          printf '%s' "${BODY}" > release-body.md
          {
            echo "tag=${TAG}"
            echo "name=${NAME}"
          } >> "$GITHUB_OUTPUT"
          echo "同步目标：${TAG} / ${NAME}"

      - name: Download GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir assets --clobber
          ls -lh assets

      - name: Create Gitee release and upload assets
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_NAME: ${{ steps.meta.outputs.name }}
        run: |
          set -euo pipefail

          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::warning::未配置 Secret GITEE_TOKEN，跳过 Gitee 同步"
            exit 0
          fi

          OWNER="yic77455"
          REPO="quick-write"
          API="https://gitee.com/api/v5/repos/${OWNER}/${REPO}"

          # Gitee 创建 Release 强制要求 target_commitish，否则报 target_commitish is missing。
          CREATE_RESPONSE="$(curl -sS -X POST "${API}/releases" \
            --data-urlencode "access_token=${GITEE_TOKEN}" \
            --data-urlencode "tag_name=${TAG}" \
            --data-urlencode "target_commitish=main" \
            --data-urlencode "name=${RELEASE_NAME}" \
            --data-urlencode "body@release-body.md" \
            --data-urlencode "prerelease=false")"

          RELEASE_ID="$(printf '%s' "${CREATE_RESPONSE}" | jq -r '.id // empty' 2>/dev/null || true)"

          if [ -z "${RELEASE_ID}" ]; then
            echo "Gitee 创建 Release 未返回 id，尝试查询同 tag 的已有 Release"
            echo "${CREATE_RESPONSE}"
            EXIST_RESPONSE="$(curl -sS "${API}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" || true)"
            RELEASE_ID="$(printf '%s' "${EXIST_RESPONSE}" | jq -r '.id // empty' 2>/dev/null || true)"
          fi

          if [ -z "${RELEASE_ID}" ]; then
            echo "::error::Gitee Release 创建失败"
            exit 1
          fi

          echo "Gitee Release id=${RELEASE_ID}"

          shopt -s nullglob
          for asset in assets/*; do
            echo "上传 $(basename "${asset}")"
            curl -fsS -X POST \
              "${API}/releases/${RELEASE_ID}/attach_files?access_token=${GITEE_TOKEN}" \
              -F "file=@${asset}" > /dev/null
          done

          echo "Gitee 同步完成：https://gitee.com/${OWNER}/${REPO}/releases/tag/${TAG}"
