name: Sync release notes to Gitee

# GitHub 草稿 Release 被 Publish 后，只把更新日志同步到 Gitee。
# 安装包改由本地脚本 scripts/sync_gitee_assets.ps1 下载并上传，避免海外 runner 传大文件。
# 同步失败时可用 workflow_dispatch 指定同一个 tag 手动补跑。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步的 Release tag，例如 v1.2.9'
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # 两种触发方式的 tag 来源不同：自动事件从 release 对象取，手动触发从 input 取。
      - name: Resolve release metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          # Release 名称与正文含特殊字符，经环境变量传入避免被 shell 执行
          EVENT_NAME: ${{ github.event.release.name }}
          EVENT_BODY: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          TAG="${EVENT_TAG:-$INPUT_TAG}"
          if [ -z "${TAG}" ]; then
            echo "::error::未指定要同步的 tag"
            exit 1
          fi

          NAME="${EVENT_NAME:-}"
          BODY="${EVENT_BODY:-}"
          if [ -z "${NAME}" ] || [ -z "${BODY}" ]; then
            NAME="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json name -q .name)"
            BODY="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json body -q .body)"
          fi

          printf '%s' "${BODY}" > release-body.md
          {
            echo "tag=${TAG}"
            echo "name=${NAME}"
          } >> "$GITHUB_OUTPUT"
          echo "同步目标：${TAG} / ${NAME}"

      - name: Sync release notes to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_NAME: ${{ steps.meta.outputs.name }}
        run: |
          set -euo pipefail

          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::warning::未配置 Secret GITEE_TOKEN，跳过同步"
            exit 0
          fi

          OWNER="yic77455"
          REPO="quick-write"
          API="https://gitee.com/api/v5/repos/${OWNER}/${REPO}"

          # 先查同 tag 的 Release，存在则只更新正文，不重复创建
          EXIST="$(curl -fsS --connect-timeout 15 --max-time 90 \
            "${API}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" 2>/dev/null || true)"
          RELEASE_ID="$(printf '%s' "${EXIST}" | jq -r '.id // empty' 2>/dev/null || true)"

          if [ -n "${RELEASE_ID}" ]; then
            echo "更新已有 Release id=${RELEASE_ID} 的更新日志"
            RESPONSE="$(curl -sS -X PATCH "${API}/releases/${RELEASE_ID}" \
              --data-urlencode "access_token=${GITEE_TOKEN}" \
              --data-urlencode "name=${RELEASE_NAME}" \
              --data-urlencode "body@release-body.md" || true)"
            if printf '%s' "${RESPONSE}" | jq -e '.id' >/dev/null 2>&1; then
              echo "更新日志同步完成"
            else
              echo "::error::更新日志写入失败：${RESPONSE}"
              exit 1
            fi
            exit 0
          fi

          # Gitee 创建 Release 强制要求 target_commitish
          RESPONSE="$(curl -sS -X POST "${API}/releases" \
            --data-urlencode "access_token=${GITEE_TOKEN}" \
            --data-urlencode "tag_name=${TAG}" \
            --data-urlencode "target_commitish=main" \
            --data-urlencode "name=${RELEASE_NAME}" \
            --data-urlencode "body@release-body.md" \
            --data-urlencode "prerelease=false")"
          if ! printf '%s' "${RESPONSE}" | jq -e '.id' >/dev/null 2>&1; then
            echo "::error::Gitee Release 创建失败：${RESPONSE}"
            exit 1
          fi
          echo "同步完成：https://gitee.com/${OWNER}/${REPO}/releases/tag/${TAG}"
