name: Build macOS

# 手动触发可单独出包；workflow_call 供 release.yml 在打 tag 时统一调用。
# 产出 universal 二进制（x86_64 + arm64），一个 DMG 同时支持 Intel 和 Apple Silicon
# 注意：flutter build macos 不支持 --target-platform（那是 Android 的参数）；
#       macOS 架构由 Xcode 工程决定，Release 默认构建 universal，故无需分架构构建。
#       macos-13 / macos-14 已退役，当前 Apple Silicon runner 用 macos-26 / macos-15。
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    # Apple Silicon runner 上构建即可产出 universal（含 x86_64 + arm64）。
    # 若要在 Intel runner 上构建，把 runs-on 改成 macos-26-intel，产物相同。
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Fetch packages
        run: flutter pub get

      # 注意：不要在这里跑 build_runner。项目的 9 个 Isar .g.dart 已提交到仓库，
      # flutter build 会直接使用。而 build_runner 用的是 pubspec 锁的 analyzer 5.13.0
      # （Dart 3.1 时代），无法解析源码里的 Null-Aware Elements 语法（?expr，Dart 3.8+），
      # 会误报语法错误导致构建失败。Flutter SDK 内置的 frontend 版本正确，能正常编译。

      # Release 构建默认产出 universal 二进制（arm64 + x86_64），
      # 架构由 Xcode 工程的 ARCHS/EXCLUDED_ARCHS 决定，无需也无法用 --target-platform 指定。
      - name: Build release app
        run: flutter build macos --release

      # macOS 构建：不签名、不公证。用户首次打开需右键 → 打开。
      # flutter build macos 在无签名证书时默认产出 ad-hoc 签名的 .app，
      # Gatekeeper 会拦但右键打开即可放行。
      - name: Package .dmg
        run: |
          set -euo pipefail

          APP_NAME="QuickWrite"
          APP_PATH="build/macos/Build/Products/Release/${APP_NAME}.app"

          if [ ! -d "${APP_PATH}" ]; then
            echo "未找到 ${APP_PATH}" >&2
            exit 1
          fi

          # 验证产物架构（应是 universal: x86_64 + arm64）
          echo "=== 可执行文件架构 ==="
          BINARY="${APP_PATH}/Contents/MacOS/${APP_NAME}"
          file "${BINARY}"
          lipo -info "${BINARY}" || true

          # 用 hdiutil 创建 DMG（macOS 自带，无需额外依赖）
          # 文件名带版本号，便于用户和发布页区分不同版本
          FULL_VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml | tr -d '"')"
          APP_VERSION="${FULL_VERSION%%+*}"
          DMG_NAME="quick-write-${APP_VERSION}-macos-universal.dmg"
          STAGING_DIR="_dmg_staging"
          rm -rf "${STAGING_DIR}"
          mkdir -p "${STAGING_DIR}"
          cp -R "${APP_PATH}" "${STAGING_DIR}/"
          # 添加 /Applications 快捷方式，用户拖拽即装
          ln -s /Applications "${STAGING_DIR}/Applications"

          hdiutil create \
            -volname "QuickWrite" \
            -srcfolder "${STAGING_DIR}" \
            -fs HFS+ \
            -format UDZO \
            -imagekey zlib-level=9 \
            "${DMG_NAME}"

          rm -rf "${STAGING_DIR}"
          ls -lh "${DMG_NAME}"

      # 在真 Mac runner 上做冒烟测试：启动应用 + 抓日志 + 截图。
      # GitHub 的 macOS runner 是真实 Apple 硬件，有 Metal，Flutter 界面能正常渲染；
      # 这正是 VMware 黑苹果做不到的部分（虚拟显卡没有 MTLDevice 会白屏）。
      # continue-on-error：截图环节出问题不应阻断 DMG 产出。
      - name: Smoke test (launch & screenshot)
        continue-on-error: true
        run: |
          set -uo pipefail

          APP_PATH="$PWD/build/macos/Build/Products/Release/QuickWrite.app"
          BIN="${APP_PATH}/Contents/MacOS/QuickWrite"
          LOG="$PWD/quickwrite-run.log"
          SHELF_SHOT="$PWD/quickwrite-screenshot.png"
          WORKSPACE_SHOT="$PWD/quickwrite-workspace-screenshot.png"

          if [ ! -x "$BIN" ]; then
            echo "未找到可执行文件：$BIN"
            exit 1
          fi

          # 直接运行二进制（而非 open -a），这样 stdout/stderr 能重定向到日志，
          # 便于捕获 Metal / MissingPluginException / Unhandled Exception 等异常。
          #
          # 分两次启动，截两张图：
          # 1) 书架页：不设环境变量，正常启动（空书架）。
          # 2) 工作台页：QUICKWRITE_SMOKE_TEST=1 触发 main.dart 的
          #    _openWorkspaceForSmokeTest()，seed 一本书并进入工作台，
          #    否则全新 runner 书架为空、截不到工作台窗口。

          echo "===== 第一次启动：书架页 ====="
          unset QUICKWRITE_SMOKE_TEST
          "$BIN" > "$LOG" 2>&1 &
          APP_PID=$!
          echo "已启动应用，pid=$APP_PID"

          # 等待初始化：字体枚举、Isar 建库、窗口创建等
          sleep 25

          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "应用进程存活"
          else
            echo "::warning::应用进程在截图前已退出，可能启动失败"
          fi

          # 把应用带到前台，确保截到的是它的窗口
          osascript -e 'tell application "QuickWrite" to activate' >/dev/null 2>&1 || true
          sleep 2

          echo "=== 显示器信息 ==="
          system_profiler SPDisplaysDataType 2>/dev/null | grep -iE "resolution|UI Looks like" || true

          # 截全屏（-x 静音）：书架页
          screencapture -x -t png "$SHELF_SHOT" || echo "::warning::书架截图命令失败"
          ls -lh "$SHELF_SHOT" 2>/dev/null || true

          # 收尾第一次启动，避免残留进程影响第二次
          kill "$APP_PID" 2>/dev/null || true
          osascript -e 'tell application "QuickWrite" to quit' >/dev/null 2>&1 || true
          sleep 3

          echo "===== 第二次启动：工作台页 ====="
          export QUICKWRITE_SMOKE_TEST=1
          "$BIN" > "$LOG" 2>&1 &
          APP_PID=$!
          echo "已启动应用，pid=$APP_PID"

          # 额外留出 seed 数据 + 导航到工作台的时间
          sleep 25

          osascript -e 'tell application "QuickWrite" to activate' >/dev/null 2>&1 || true
          sleep 2

          # 截全屏：工作台页
          screencapture -x -t png "$WORKSPACE_SHOT" || echo "::warning::工作台截图命令失败"
          ls -lh "$WORKSPACE_SHOT" 2>/dev/null || true

          echo "=== 应用运行日志（第二次启动） ==="
          cat "$LOG" 2>/dev/null || true

          # 日志里出现这些关键字说明渲染/插件有问题
          if grep -qiE "Could not acquire Metal|Unable to create FlutterView|Unhandled Exception|MissingPluginException" "$LOG" 2>/dev/null; then
            echo "::warning::应用日志中发现异常关键字，请检查上面的日志与截图"
          fi

          # 收尾：退出应用，避免残留进程拖住 job
          kill "$APP_PID" 2>/dev/null || true
          osascript -e 'tell application "QuickWrite" to quit' >/dev/null 2>&1 || true
          sleep 2

      - name: Upload smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickwrite-macos-smoketest
          path: |
            quickwrite-screenshot.png
            quickwrite-workspace-screenshot.png
            quickwrite-run.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quick-write-macos-universal
          path: quick-write-*-macos-universal.dmg
          if-no-files-found: error
          retention-days: 30
